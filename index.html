<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>My Dictionary</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; text-align: center; }
    .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 1rem; }
    button { background: #3b82f6; color: white; border: none; padding: 12px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 20px; border: 1px solid #334155; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { background: #334155; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; }
    .add-btn { width: 100%; margin-top: 12px; background: #10b981; }
    .word-item { background: #1e293b; border-radius: 10px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
    .word-head { display: flex; justify-content: space-between; align-items: baseline; }
    .del-btn { background: transparent; color: #ef4444; padding: 0; font-size: 0.85rem; }
  </style>
</head>
<body>

  <h1>📖 My Dictionary</h1>

  <div class="search-box">
    <input type="text" id="wordInput" placeholder="Look up a word..." />
    <button onclick="lookupWord()">Search</button>
  </div>

  <div id="resultArea" style="display:none;" class="card">
    <h2 id="resultWord" style="margin:0 0 6px 0;"></h2>
    <p id="resultMeaning" style="margin: 0; color: #cbd5e1; font-size: 0.95rem;"></p>
    <div class="tags" id="resultSynonyms"></div>
    <button class="add-btn" onclick="saveCurrentWord()">+ Add to My Dictionary</button>
  </div>

  <h3 style="margin-top: 24px; border-bottom: 1px solid #334155; padding-bottom: 8px;">Saved Words</h3>
  <div id="wordList"></div>

  <script>
    let currentData = null;

    async function lookupWord() {
      const query = document.getElementById('wordInput').value.trim();
      if (!query) return;

      const resArea = document.getElementById('resultArea');
      resArea.style.display = 'block';
      document.getElementById('resultWord').innerText = "Searching...";
      document.getElementById('resultMeaning').innerText = "";
      document.getElementById('resultSynonyms').innerHTML = "";

      try {
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${query}`);
        if (!res.ok) throw new Error("Word not found");
        const data = await res.json();
        
        const word = data[0].word;
        const meaning = data[0].meanings[0]?.definitions[0]?.definition || "No definition found.";
        
        // Collect synonyms across all definitions
        let synonyms = [];
        data[0].meanings.forEach(m => {
          if (m.synonyms) synonyms.push(...m.synonyms);
          m.definitions.forEach(d => { if (d.synonyms) synonyms.push(...d.synonyms); });
        });
        synonyms = [...new Set(synonyms)].slice(0, 6); // Top 6 unique

        currentData = { word, meaning, synonyms, date: new Date().toLocaleDateString() };

        document.getElementById('resultWord').innerText = word;
        document.getElementById('resultMeaning').innerText = meaning;
        document.getElementById('resultSynonyms').innerHTML = synonyms.map(s => `<span class="tag">${s}</span>`).join('');
      } catch (err) {
        document.getElementById('resultWord').innerText = "Not found";
        document.getElementById('resultMeaning').innerText = "Could not find a definition for this word.";
        currentData = null;
      }
    }

    function saveCurrentWord() {
      if (!currentData) return;
      let words = JSON.parse(localStorage.getItem('my_words') || '[]');
      if (!words.some(w => w.word.toLowerCase() === currentData.word.toLowerCase())) {
        words.unshift(currentData);
        localStorage.setItem('my_words', JSON.stringify(words));
        renderList();
      }
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('wordInput').value = '';
    }

    function deleteWord(index) {
      let words = JSON.parse(localStorage.getItem('my_words') || '[]');
      words.splice(index, 1);
      localStorage.setItem('my_words', JSON.stringify(words));
      renderList();
    }

    function renderList() {
      const container = document.getElementById('wordList');
      const words = JSON.parse(localStorage.getItem('my_words') || '[]');
      if (words.length === 0) {
        container.innerHTML = '<p style="color:#64748b; font-size:0.9rem;">No words saved yet.</p>';
        return;
      }
      container.innerHTML = words.map((w, idx) => `
        <div class="word-item">
          <div class="word-head">
            <strong style="font-size:1.1rem; color:#60a5fa;">${w.word}</strong>
            <button class="del-btn" onclick="deleteWord(${idx})">Remove</button>
          </div>
          <p style="margin:6px 0; font-size:0.9rem; color:#cbd5e1;">${w.meaning}</p>
          <div class="tags">
            ${w.synonyms.map(s => `<span class="tag">${s}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    renderList();
  </script>
</body>
</html>
