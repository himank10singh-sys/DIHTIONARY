<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginalia — your word list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF6EE;
    --paper-raised: #FFFFFF;
    --ink: #23241F;
    --ink-soft: #63645C;
    --rule: #DDD6C4;
    --burgundy: #7C3B3B;
    --burgundy-deep: #5E2C2C;
    --sage: #6C7A5D;
    --error: #A23B3B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .page{
    max-width: 640px;
    margin: 0 auto;
    padding: 36px 20px 80px;
  }
  header{
    margin-bottom: 28px;
  }
  .kicker{
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 4px;
  }
  h1{
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 32px;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .count{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  form.lookup{
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  input[type="text"]{
    flex: 1;
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    padding: 12px 14px;
    border: 1.5px solid var(--rule);
    border-radius: 6px;
    background: var(--paper-raised);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="text"]:focus{
    border-color: var(--burgundy);
  }
  button{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 0 20px;
    border: none;
    border-radius: 6px;
    background: var(--burgundy);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled){ background: var(--burgundy-deep); }
  button:disabled{ opacity: 0.55; cursor: default; }

  .status{
    min-height: 20px;
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }
  .status.error{ color: var(--error); }

  .searchbar{
    margin: 30px 0 14px;
  }
  .searchbar input{
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 8px 12px;
    border: 1px solid var(--rule);
    border-radius: 5px;
    background: transparent;
    color: var(--ink-soft);
  }

  .entries{
    display: flex;
    flex-direction: column;
  }
  .entry{
    padding: 20px 0;
    border-bottom: 1px solid var(--rule);
    position: relative;
  }
  .entry:first-child{ padding-top: 4px; }
  .entry-top{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .entry-word{
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--ink);
  }
  .entry-pos{
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--sage);
    margin-left: 8px;
  }
  .entry-date{
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .entry-meaning{
    font-size: 15.5px;
    line-height: 1.55;
    margin: 8px 0 0;
    color: var(--ink);
  }
  .entry-example{
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 8px 0 0;
    padding-left: 12px;
    border-left: 2px solid var(--rule);
  }
  .entry-remove{
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12.5px;
    padding: 0;
    margin-top: 10px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .entry-remove:hover{ color: var(--error); }

  .empty{
    padding: 40px 0;
    text-align: center;
    color: var(--ink-soft);
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-size: 16px;
  }

  .skeleton{
    padding: 20px 0;
    border-bottom: 1px solid var(--rule);
  }
  .skeleton .bar{
    height: 12px;
    background: var(--rule);
    border-radius: 4px;
    opacity: 0.5;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .skeleton .bar.w1{ width: 30%; margin-bottom: 10px; height: 18px; }
  .skeleton .bar.w2{ width: 90%; margin-bottom: 6px; }
  .skeleton .bar.w3{ width: 70%; }
  @keyframes pulse{ 0%,100%{opacity:0.35;} 50%{opacity:0.65;} }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="kicker">while you read</p>
    <h1>Marginalia</h1>
    <p class="count" id="count">Loading your list…</p>
  </header>

  <form class="lookup" id="lookupForm">
    <input type="text" id="wordInput" placeholder="Type a word you just met…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit" id="lookupBtn">Look up</button>
  </form>
  <div class="status" id="status"></div>

  <div class="searchbar">
    <input type="text" id="searchInput" placeholder="Search your saved words…">
  </div>

  <div class="entries" id="entries"></div>
</div>

<script>
const entriesEl = document.getElementById('entries');
const countEl = document.getElementById('count');
const statusEl = document.getElementById('status');
const form = document.getElementById('lookupForm');
const wordInput = document.getElementById('wordInput');
const lookupBtn = document.getElementById('lookupBtn');
const searchInput = document.getElementById('searchInput');

let allEntries = [];

function setStatus(msg, isError){
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('error', !!isError);
}

function keyFor(word){
  return 'word:' + word.trim().toLowerCase();
}

function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

async function loadEntries(){
  entriesEl.innerHTML =
    '<div class="skeleton"><div class="bar w1"></div><div class="bar w2"></div><div class="bar w3"></div></div>'.repeat(3);
  try{
    const list = await window.storage.list('word:');
    const keys = (list && list.keys) ? list.keys : [];
    const results = await Promise.all(keys.map(async k => {
      try{
        const r = await window.storage.get(k);
        return r ? JSON.parse(r.value) : null;
      }catch(e){ return null; }
    }));
    allEntries = results.filter(Boolean).sort((a,b) => new Date(b.addedAt) - new Date(a.addedAt));
    renderEntries(allEntries);
    updateCount();
  }catch(e){
    entriesEl.innerHTML = '';
    countEl.textContent = "Couldn't load your list.";
  }
}

function updateCount(){
  const n = allEntries.length;
  countEl.textContent = n === 0 ? 'No words saved yet' : (n === 1 ? '1 word saved' : n + ' words saved');
}

function renderEntries(list){
  if(list.length === 0){
    entriesEl.innerHTML = '<div class="empty">Nothing here yet — the next unfamiliar word goes above.</div>';
    return;
  }
  entriesEl.innerHTML = '';
  list.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <div class="entry-top">
        <div><span class="entry-word">${escapeHtml(entry.word)}</span>${entry.partOfSpeech ? `<span class="entry-pos">${escapeHtml(entry.partOfSpeech)}</span>` : ''}</div>
        <span class="entry-date">${formatDate(entry.addedAt)}</span>
      </div>
      <p class="entry-meaning">${escapeHtml(entry.meaning)}</p>
      ${entry.example ? `<p class="entry-example">${escapeHtml(entry.example)}</p>` : ''}
      <button class="entry-remove" data-word="${escapeHtml(entry.word)}">Remove</button>
    `;
    entriesEl.appendChild(div);
  });
  entriesEl.querySelectorAll('.entry-remove').forEach(btn => {
    btn.addEventListener('click', () => removeEntry(btn.getAttribute('data-word')));
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

async function removeEntry(word){
  try{
    await window.storage.delete(keyFor(word));
    allEntries = allEntries.filter(e => e.word.toLowerCase() !== word.toLowerCase());
    renderEntries(applyFilter());
    updateCount();
  }catch(e){
    setStatus("Couldn't remove that word — try again.", true);
  }
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  if(!q) return allEntries;
  return allEntries.filter(e =>
    e.word.toLowerCase().includes(q) || (e.meaning && e.meaning.toLowerCase().includes(q))
  );
}

searchInput.addEventListener('input', () => renderEntries(applyFilter()));

async function lookupWord(word){
  const system = "You define words for someone reading a novel who just met the word for the first time. The word may occasionally have a small typo (a missing or swapped letter) since it was typed quickly - if so, silently correct it to the most likely intended real word and define that one, and put the corrected spelling in the \"word\" field. Respond with ONLY raw JSON, no markdown fences, no preamble, no explanation, in exactly this shape: {\"word\": \"corrected spelling if needed, else the same word\", \"partOfSpeech\": \"noun\", \"meaning\": \"a single clear sentence defining the word as commonly used\", \"example\": \"a short original example sentence using the word\"}. Keep the meaning to one sentence. Always return valid JSON even if you are unsure of the word - give your best guess rather than refusing.";
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 300,
      system: system,
      messages: [{ role: "user", content: `Define the word: "${word}"` }]
    })
  });
  if(!response.ok){
    throw new Error("API request failed with status " + response.status);
  }
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === 'text' && b.text && b.text.trim().length > 0);
  if(!textBlock) throw new Error("No text in response");

  const raw = textBlock.text;
  // Pull out the JSON object even if the model wrapped it in fences or extra prose.
  const firstBrace = raw.indexOf('{');
  const lastBrace = raw.lastIndexOf('}');
  if(firstBrace === -1 || lastBrace === -1 || lastBrace < firstBrace){
    throw new Error("Could not find JSON in response: " + raw.slice(0, 200));
  }
  const jsonSlice = raw.slice(firstBrace, lastBrace + 1);
  try{
    return JSON.parse(jsonSlice);
  }catch(parseErr){
    throw new Error("Malformed JSON from model: " + jsonSlice.slice(0, 200));
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const word = wordInput.value.trim();
  if(!word) return;

  lookupBtn.disabled = true;
  lookupBtn.textContent = 'Looking up…';
  setStatus('');

  try{
    const def = await lookupWord(word);
    const finalWord = (def.word && def.word.trim()) ? def.word.trim() : word;
    const entry = {
      word: finalWord,
      partOfSpeech: def.partOfSpeech || '',
      meaning: def.meaning || '',
      example: def.example || '',
      addedAt: new Date().toISOString()
    };
    const result = await window.storage.set(keyFor(finalWord), JSON.stringify(entry));
    if(!result) throw new Error("Save failed");

    allEntries = allEntries.filter(en => en.word.toLowerCase() !== finalWord.toLowerCase());
    allEntries.unshift(entry);
    renderEntries(applyFilter());
    updateCount();
    wordInput.value = '';
    setStatus(finalWord.toLowerCase() === word.toLowerCase()
      ? 'Saved “' + finalWord + '” to your list.'
      : 'Saved “' + finalWord + '” (auto-corrected from “' + word + '”).');
  }catch(err){
    setStatus("Couldn't look that up just now — check your connection and try again.", true);
  }finally{
    lookupBtn.disabled = false;
    lookupBtn.textContent = 'Look up';
    wordInput.focus();
  }
});

loadEntries();
</script>
</body>
</html>
