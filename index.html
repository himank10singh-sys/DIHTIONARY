<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>My Dictionary</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; max-width: 600px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; text-align: center; }
    .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 1rem; outline: none; }
    input:focus { border-color: #3b82f6; }
    button { background: #3b82f6; color: white; border: none; padding: 12px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 20px; border: 1px solid #334155; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag { background: #334155; color: #93c5fd; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; }
    .add-btn { width: 100%; margin-top: 14px; background: #10b981; padding: 12px; font-size: 0.95rem; }
    .word-item { background: #1e293b; border-radius: 10px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
    .word-head { display: flex; justify-content: space-between; align-items: baseline; }
    .del-btn { background: transparent; color: #ef4444; padding: 0; font-size: 0.85rem; }
    .status-msg { font-size: 0.85rem; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>

  <h1>📖 My Dictionary</h1>

  <div class="search-box">
    <input type="text" id="wordInput" placeholder="Look up a word (e.g., ephemeral)..." />
    <button id="searchBtn" onclick="lookupWord()">Search</button>
  </div>

  <div id="resultArea" style="display:none;" class="card">
    <h2 id="resultWord" style="margin:0 0 6px 0;"></h2>
    <p id="resultMeaning" style="margin: 0; color: #cbd5e1; font-size: 0.95rem; line-height: 1.4;"></p>
    <div class="tags" id="resultSynonyms"></div>
    <div id="statusIndicator" class="status-msg"></div>
    <button id="addWordBtn" class="add-btn" onclick="saveCurrentWord()">+ Add to My Dictionary</button>
  </div>

  <h3 style="margin-top: 24px; border-bottom: 1px solid #334155; padding-bottom: 8px;">Saved Words</h3>
  <div id="wordList"></div>

  <script>
    let currentData = null;

    // Enable 'Enter' key to trigger search
    document.getElementById('wordInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') lookupWord();
    });

    async function lookupWord() {
      const query = document.getElementById('wordInput').value.trim().toLowerCase();
      if (!query) return;

      const resArea = document.getElementById('resultArea');
      const resWord = document.getElementById('resultWord');
      const resMeaning = document.getElementById('resultMeaning');
      const resSynonyms = document.getElementById('resultSynonyms');
      const addBtn = document.getElementById('addWordBtn');
      const statusIndicator = document.getElementById('statusIndicator');

      resArea.style.display = 'block';
      resWord.innerText = query;
      resMeaning.innerText = "Looking up definition...";
      resSynonyms.innerHTML = "";
      statusIndicator.innerText = "";
      addBtn.style.display = "none";

      try {
        // Attempt Primary Source: Free Dictionary API
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(query)}`);
        
        if (response.ok) {
          const data = await response.json();
          let definition = "No definition found.";
          let synonyms = [];

          if (data[0]?.meanings?.length > 0) {
            definition = data[0].meanings[0].definitions[0]?.definition || definition;
            data[0].meanings.forEach(m => {
              if (m.synonyms) synonyms.push(...m.synonyms);
              m.definitions?.forEach(d => { if (d.synonyms) synonyms.push(...d.synonyms); });
            });
          }

          synonyms = [...new Set(synonyms)].slice(0, 6);
          displaySuccess(query, definition, synonyms);
          return;
        }

        // Fallback Source: Datamuse API (Definitions + Synonyms)
        const fallbackRes = await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(query)}&md=d&rel_syn=${encodeURIComponent(query)}&max=6`);
        const fallbackData = await fallbackRes.json();

        if (fallbackData && fallbackData.length > 0 && fallbackData[0].defs) {
          const rawDef = fallbackData[0].defs[0] || "";
          const cleanDef = rawDef.replace(/^[a-z]+\t/, ""); // remove speech part tag
          const synonyms = fallbackData.slice(1).map(item => item.word).slice(0, 6);
          displaySuccess(query, cleanDef || "Found in vocabulary database.", synonyms);
        } else {
          throw new Error("Word definition not available.");
        }

      } catch (err) {
        resWord.innerText = "Word not found";
        resMeaning.innerText = "Check your spelling or try another English word.";
        statusIndicator.innerText = `Details: ${err.message || 'Network request failed'}`;
        currentData = null;
      }
    }

    function displaySuccess(word, meaning, synonyms) {
      document.getElementById('resultWord').innerText = word;
      document.getElementById('resultMeaning').innerText = meaning;
      document.getElementById('resultSynonyms').innerHTML = synonyms.length > 0
        ? synonyms.map(s => `<span class="tag">${s}</span>`).join('')
        : '<span style="color:#64748b; font-size:0.8rem;">No synonyms found</span>';
      
      document.getElementById('addWordBtn').style.display = "block";
      currentData = { word, meaning, synonyms };
    }

    function saveCurrentWord() {
      if (!currentData) return;
      let words = JSON.parse(localStorage.getItem('my_words') || '[]');
      if (!words.some(w => w.word.toLowerCase() === currentData.word.toLowerCase())) {
        words.unshift(currentData);
        localStorage.setItem('my_words', JSON.stringify(words));
        renderList();
      }
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('wordInput').value = '';
    }

    function deleteWord(index) {
      let words = JSON.parse(localStorage.getItem('my_words') || '[]');
      words.splice(index, 1);
      localStorage.setItem('my_words', JSON.stringify(words));
      renderList();
    }

    function renderList() {
      const container = document.getElementById('wordList');
      const words = JSON.parse(localStorage.getItem('my_words') || '[]');
      if (words.length === 0) {
        container.innerHTML = '<p style="color:#64748b; font-size:0.9rem;">No words saved yet.</p>';
        return;
      }
      container.innerHTML = words.map((w, idx) => `
        <div class="word-item">
          <div class="word-head">
            <strong style="font-size:1.1rem; color:#60a5fa; text-transform: capitalize;">${w.word}</strong>
            <button class="del-btn" onclick="deleteWord(${idx})">Remove</button>
          </div>
          <p style="margin:6px 0; font-size:0.9rem; color:#cbd5e1;">${w.meaning}</p>
          <div class="tags">
            ${(w.synonyms || []).map(s => `<span class="tag">${s}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    renderList();
  </script>
</body>
</html>
